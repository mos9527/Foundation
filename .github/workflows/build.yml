name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  VULKAN_SDK_VERSION: "1.4.350.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows x64
          runner: windows-latest
          platform: windows
        - name: Android Examples
          runner: windows-latest
          platform: android

    steps:
    - uses: actions/checkout@v4

    # ── Ninja + MSVC  ──
    - name: Install Ninja
      if: matrix.platform == 'windows'
      shell: pwsh
      run: choco install ninja -y --no-progress

    - name: Setup MSVC dev environment
      if: matrix.platform == 'windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ── Vulkan SDK (provides slangc, needed by both desktop and Android shader builds) ──
    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $ver = "${{ env.VULKAN_SDK_VERSION }}"
        $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
        Write-Host "Downloading Vulkan SDK $ver ..."
        Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
        Write-Host "Installing (silent) ..."
        Start-Process -FilePath .\VulkanSDK.exe `
          -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
          -Wait -NoNewWindow
        $sdkPath = "C:\VulkanSDK\$ver"
        echo "VULKAN_SDK=$sdkPath"       >> $env:GITHUB_ENV
        echo "$sdkPath\Bin"              >> $env:GITHUB_PATH
        & "$sdkPath\Bin\slangc.exe" -v

    # ── Configure & Build ──
    - name: Create build directory
      if: matrix.platform == 'windows'
      run: cmake -E make_directory ${{ github.workspace }}/build

    - name: Configure CMake
      if: matrix.platform == 'windows'
      working-directory: ${{ github.workspace }}/build
      shell: pwsh
      run: >
        cmake ..
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DFOUNDATION_WITH_EXAMPLES=ON
        -DFOUNDATION_WITH_PROFILING=OFF
        -DFOUNDATION_RHIVULKAN_VALIDATION_LAYER=OFF
        -DFOUNDATION_WITH_JOLT_EXAMPLES=ON

    - name: Build
      if: matrix.platform == 'windows'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        targets=(
          EditorWithUtil
          # BEGIN GENERATED CI EXAMPLE TARGETS
          Example_PhysicsJolt
          Example_BindlessSimple
          Example_DynamicGeometry
          Example_GPUScene
          Example_DebugText
          Example_SDF2D
          Example_MipGeneration
          Example_AutodiffSimple
          Example_Triangle
          Example_MeshShaderHierarchicalLOD
          Example_ImGui
          Example_MeshShaderHello
          Example_MandelbrotCompute
          Example_CIEChromacity
          # END GENERATED CI EXAMPLE TARGETS
        )
        args=()
        for target in "${targets[@]}"; do
          args+=(--target "$target")
        done
        cmake --build . "${args[@]}"

    # ── Android Examples ──
    # windows-latest ships the Android SDK/NDK/CMake preinstalled, and the Vulkan
    # SDK step above put slangc on PATH for the on-host shader compilation.
    - name: Setup JDK
      if: matrix.platform == 'android'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Build Android examples
      if: matrix.platform == 'android'
      working-directory: ${{ github.workspace }}/Android
      shell: pwsh
      run: |
        # Pin the NDK to whatever the runner image ships so AGP doesn't try to
        # download its (different) default version.
        $env:FOUNDATION_ANDROID_NDK_VERSION = Split-Path $env:ANDROID_NDK_HOME -Leaf
        Write-Host "Using NDK $env:FOUNDATION_ANDROID_NDK_VERSION"
        gradle --no-daemon :app:assembleDebug

    - name: Stage artifacts
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $package = "${{ github.workspace }}/package"
        $bin = "${{ github.workspace }}/build/bin"
        $configBin = Join-Path $bin "${{ env.BUILD_TYPE }}"
        if (-not (Test-Path $configBin)) {
          # Single-config generators (e.g. Ninja) don't nest output under a config folder.
          $configBin = $bin
        }

        if (Test-Path $package) {
          Remove-Item $package -Recurse -Force
        }

        New-Item -ItemType Directory -Path $package | Out-Null
        Copy-Item -Path (Join-Path $configBin "*") -Destination $package -Recurse -Force
        if ($configBin -ne $bin) {
          Copy-Item -Path (Join-Path $bin "data") -Destination $package -Recurse -Force
        }

    # ── Upload ──
    - name: Upload artifacts
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: Foundation-win-x64
        path: |
          ${{ github.workspace }}/package/
          !${{ github.workspace }}/package/**/*.pdb
          !${{ github.workspace }}/package/**/*.ilk
        compression-level: 9

    - name: Upload Android APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v4
      with:
        name: Foundation-android-examples
        path: ${{ github.workspace }}/Android/app/build/outputs/apk/debug/*.apk
        compression-level: 9
