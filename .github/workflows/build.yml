name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  BUILD_TYPE: MinSizeRel
  VULKAN_SDK_VERSION: "1.4.350.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows x64
          runner: windows-latest
          platform: windows
          arch: x64
          artifact: Foundation-win-x64
        - name: Windows ARM64
          runner: windows-11-arm
          platform: windows
          arch: arm64
          artifact: Foundation-win-arm64
        - name: macOS ARM64
          runner: macos-latest
          platform: macos
          arch: arm64
          artifact: Foundation-macos-arm64
        - name: Ubuntu x64
          runner: ubuntu-latest
          platform: linux
          arch: x64
          artifact: Foundation-linux-x64
        - name: Android Examples
          runner: windows-latest
          platform: android
          arch: x64
          artifact: Foundation-android-examples

    steps:
    - uses: actions/checkout@v4

    # ── Host toolchains ──
    - name: Install Ninja
      if: matrix.platform == 'windows'
      shell: pwsh
      run: choco install ninja -y --no-progress

    - name: Setup MSVC dev environment
      if: matrix.platform == 'windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install Linux packages
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build pkg-config \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
          libxi-dev libxinerama-dev libxss-dev libxxf86vm-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
          libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libdbus-1-dev libudev-dev libibus-1.0-dev libusb-1.0-0-dev \
          libvulkan-dev

    - name: Install Ninja (macOS)
      if: matrix.platform == 'macos'
      run: brew install ninja

    # ── Vulkan SDK (provides slangc; needed by desktop and Android shader builds) ──
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ver = "${{ env.VULKAN_SDK_VERSION }}"
        if ("${{ matrix.arch }}" -eq "arm64") {
          $url = "https://sdk.lunarg.com/sdk/download/$ver/warm/vulkan_sdk.exe?Human=true"
        } else {
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe?Human=true"
        }
        Write-Host "Downloading Vulkan SDK $ver ($url) ..."
        Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
        Write-Host "Installing (silent) ..."
        Start-Process -FilePath .\VulkanSDK.exe `
          -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
          -Wait -NoNewWindow
        $sdkPath = "C:\VulkanSDK\$ver"
        echo "VULKAN_SDK=$sdkPath"       >> $env:GITHUB_ENV
        echo "$sdkPath\Bin"              >> $env:GITHUB_PATH
        & "$sdkPath\Bin\slangc.exe" -v

    - name: Install Vulkan SDK (Linux)
      if: matrix.platform == 'linux'
      run: |
        ver="${{ env.VULKAN_SDK_VERSION }}"
        url="https://sdk.lunarg.com/sdk/download/$ver/linux/vulkan_sdk.tar.xz?Human=true"
        echo "Downloading Vulkan SDK $ver ..."
        curl -fL "$url" -o vulkan_sdk.tar.xz
        mkdir -p "$HOME/VulkanSDK"
        tar xf vulkan_sdk.tar.xz -C "$HOME/VulkanSDK"
        sdk="$HOME/VulkanSDK/$ver/x86_64"
        echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$sdk/lib:$sdk/lib/VulkanLoader/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        echo "$sdk/bin" >> "$GITHUB_PATH"
        "$sdk/bin/slangc" -v

    - name: Install Vulkan SDK (macOS)
      if: matrix.platform == 'macos'
      run: |
        ver="${{ env.VULKAN_SDK_VERSION }}"
        url="https://sdk.lunarg.com/sdk/download/$ver/mac/vulkan_sdk.zip?Human=true"
        echo "Downloading Vulkan SDK $ver ..."
        curl -fL "$url" -o vulkan_sdk.zip
        unzip -q vulkan_sdk.zip
        app=$(find . -maxdepth 2 -name '*.app' -type d | head -n 1)
        installer="$app/Contents/MacOS/$(basename "$app" .app)"
        root="$HOME/VulkanSDK/$ver"
        mkdir -p "$root"
        "$installer" --root "$root" --accept-licenses --default-answer --confirm-command install copy_only=1
        sdk="$root/macOS"
        echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$sdk/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        echo "$sdk/bin" >> "$GITHUB_PATH"
        "$sdk/bin/slangc" -v

    # ── Configure & Build ──
    - name: Create build directory
      if: matrix.platform != 'android'
      run: cmake -E make_directory ${{ github.workspace }}/build

    - name: Configure CMake
      if: matrix.platform != 'android'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        extra=()
        if [ "${{ matrix.platform }}" = "macos" ]; then
          extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64)
        fi
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DFOUNDATION_WITH_EXAMPLES=ON \
          -DFOUNDATION_WITH_PROFILING=OFF \
          -DFOUNDATION_RHIVULKAN_VALIDATION_LAYER=OFF \
          -DFOUNDATION_WITH_JOLT_EXAMPLES=ON \
          "${extra[@]}"

    - name: Build
      if: matrix.platform != 'android'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        targets=(
          EditorWithUtil
          # BEGIN GENERATED CI EXAMPLE TARGETS
          ExampleRenderer_JoltPhysics
          ExampleRenderer_Dynamic
          ExampleRenderer_GLTF
          Example_BindlessSimple
          Example_DebugText
          Example_SDF2D
          Example_MipGeneration
          Example_AutodiffSimple
          Example_Triangle
          Example_ImGui
          Example_MandelbrotCompute
          Example_CIEChromacity
          # END GENERATED CI EXAMPLE TARGETS
        )
        args=()
        for target in "${targets[@]}"; do
          args+=(--target "$target")
        done
        cmake --build . "${args[@]}"

    # ── Android Examples ──
    # windows-latest ships the Android SDK/NDK/CMake preinstalled, and the Vulkan
    # SDK step above put slangc on PATH for the on-host shader compilation.
    - name: Setup JDK
      if: matrix.platform == 'android'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Build Android examples
      if: matrix.platform == 'android'
      working-directory: ${{ github.workspace }}/Android
      shell: pwsh
      run: |
        # Pin the NDK to whatever the runner image ships so AGP doesn't try to
        # download its (different) default version.
        $env:FOUNDATION_ANDROID_NDK_VERSION = Split-Path $env:ANDROID_NDK_HOME -Leaf
        Write-Host "Using NDK $env:FOUNDATION_ANDROID_NDK_VERSION"
        gradle --no-daemon :app:assembleDebug

    - name: Stage artifacts
      if: matrix.platform != 'android'
      shell: bash
      run: |
        package="${{ github.workspace }}/package"
        bin="${{ github.workspace }}/build/bin"
        config_bin="$bin/${{ env.BUILD_TYPE }}"
        if [ ! -d "$config_bin" ]; then
          # Single-config generators (e.g. Ninja) don't nest output under a config folder.
          config_bin="$bin"
        fi

        rm -rf "$package"
        mkdir -p "$package"
        cp -a "$config_bin"/. "$package"/
        if [ "$config_bin" != "$bin" ]; then
          if [ -d "$bin/Data" ]; then
            cp -a "$bin/Data" "$package/"
          elif [ -d "$bin/data" ]; then
            cp -a "$bin/data" "$package/"
          fi
        fi

    # ── Upload ──
    - name: Upload artifacts
      if: matrix.platform != 'android'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          ${{ github.workspace }}/package/
          !${{ github.workspace }}/package/**/*.pdb
          !${{ github.workspace }}/package/**/*.ilk
        compression-level: 9

    - name: Upload Android APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ github.workspace }}/Android/app/build/outputs/apk/debug/*.apk
        compression-level: 9
